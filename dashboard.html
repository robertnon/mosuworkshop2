        '</div>' +
        '</div>';

      html += '</div>';
      return html;
    }

    function wireOrderDetail(detailRow, order) {
      const select = detailRow.querySelector('.status-preset-select');
      const customInput = detailRow.querySelector('.status-custom-input');
      const saveBtn = detailRow.querySelector('.status-save-btn');
      const msg = detailRow.querySelector('.status-save-msg');

      const currentStatus = pickField(order, 'status').toString();
      if (STATUS_PRESETS.indexOf(currentStatus) !== -1) {
        select.value = currentStatus;
      } else {
        select.value = '__custom__';
        customInput.value = currentStatus;
        customInput.classList.remove('hidden');
      }

      select.addEventListener('change', function () {
        customInput.classList.toggle('hidden', select.value !== '__custom__');
      });

      saveBtn.addEventListener('click', async function () {
        const newStatus = select.value === '__custom__' ? customInput.value.trim() : select.value;
        if (!newStatus) { msg.textContent = 'กรุณาระบุสถานะ'; msg.className = 'row-status status-save-msg err'; return; }

        saveBtn.disabled = true;
        msg.textContent = 'กำลังบันทึก...';
        msg.className = 'row-status status-save-msg';

        try {
          const result = await apiPost('updateOrderStatus', { orderCode: pickField(order, 'orderCode'), status: newStatus });
          if (result.result === 'success') {
            const statusKey = pickFieldKey(order, 'status') || 'สถานะการชำระเงิน';
            order[statusKey] = newStatus;
            msg.textContent = 'บันทึกแล้ว ✓ (รีเฟรชแท็บเพื่อดูสถานะล่าสุดในตาราง)';
            msg.className = 'row-status status-save-msg ok';
          } else {
            msg.textContent = '⚠ ' + (result.message || 'บันทึกไม่สำเร็จ');
            msg.className = 'row-status status-save-msg err';
          }
        } catch (err) {
          msg.textContent = '⚠ เชื่อมต่อไม่สำเร็จ';
          msg.className = 'row-status status-save-msg err';
        }
        saveBtn.disabled = false;
      });

      // ---- ลบออเดอร์ถาวร ----
      // ปุ่มจะกดได้ต่อเมื่อพิมพ์เลขที่คำสั่งซื้อให้ตรงเป๊ะ แล้วยังต้องผ่าน confirm() อีกชั้น
      // ฝั่ง .gs ก็เช็ค confirmCode ซ้ำอีกที กันกรณียิง API ตรงๆ
      const orderCode = pickField(order, 'orderCode').toString();
      const delInput = detailRow.querySelector('.del-confirm-input');
      const delBtn = detailRow.querySelector('.del-order-btn');
      const delMsg = detailRow.querySelector('.del-order-msg');

      delInput.addEventListener('input', function () {
        delBtn.disabled = delInput.value.trim() !== orderCode;
      });

      delBtn.addEventListener('click', async function () {
        if (delInput.value.trim() !== orderCode) return;
        if (!confirm('ลบคำสั่งซื้อ ' + orderCode + ' ออกจากชีตถาวร?\n\nกู้จากหน้านี้ไม่ได้ และยอดขาย/กำไรจะเปลี่ยนตาม')) return;

        delBtn.disabled = true;
        delInput.disabled = true;
        delMsg.textContent = 'กำลังลบ...';
        delMsg.className = 'row-status del-order-msg';

        try {
          const result = await apiPost('deleteOrder', { orderCode: orderCode, confirmCode: delInput.value.trim() });
          if (result.result === 'success') {
            delMsg.textContent = 'ลบแล้ว ✓ กำลังโหลดรายการใหม่...';
            delMsg.className = 'row-status del-order-msg ok';
            // ยอดกำไรเปลี่ยนตามด้วย เลยต้องล้างแคชแท็บกำไรให้โหลดใหม่รอบหน้า
            state.loaded.orders = false;
            state.loaded.profit = false;
            setTimeout(loadOrdersTab, 700);
          } else {
            delMsg.textContent = '⚠ ' + (result.message || 'ลบไม่สำเร็จ');
            delMsg.className = 'row-status del-order-msg err';
            delBtn.disabled = false;
            delInput.disabled = false;
          }
        } catch (err) {
          delMsg.textContent = '⚠ เชื่อมต่อไม่สำเร็จ';
          delMsg.className = 'row-status del-order-msg err';
          delBtn.disabled = false;
          delInput.disabled = false;
        }
      });
    }

    // ========== Tab: โค้ดส่วนลด ==========
    async function loadDiscountsTab() {
      const panel = document.getElementById('panel-discounts');
      setStatus('กำลังโหลดโค้ดส่วนลด...');
      try {
        const result = await apiGet('getAdminDiscounts');
        if (result.result !== 'success') { onAuthFail(result.message); return; }
        state.loaded.discounts = true;
        renderDiscountsTab(panel, result.discounts || []);
        const usable = (result.discounts || []).filter(function (d) { return d.usable; }).length;
        setStatus('โค้ดทั้งหมด ' + (result.discounts || []).length + ' โค้ด · ใช้ได้อยู่ ' + usable + ' โค้ด');
      } catch (err) {
        setStatus('⚠ เชื่อมต่อไม่สำเร็จ: ' + err.message, true);
      }
    }

    // ป้ายสถานะของโค้ด — เรียงตามลำดับความสำคัญ ปิดใช้งาน > หมดอายุ > ใช้ครบโควตา
    function discountBadge(d) {
      if (!d.active) return '<span class="status-badge cancelled">ปิดใช้งาน</span>';
      if (d.expired) return '<span class="status-badge flagged">หมดอายุแล้ว</span>';
      if (d.full)    return '<span class="status-badge flagged">ใช้ครบโควตา</span>';
      return '<span class="status-badge confirmed">ใช้ได้</span>';
    }

    function discountFieldsHtml(d) {
      const percent = d ? d.percent : '';
      const maxUses = (d && d.maxUses !== null && typeof d.maxUses !== 'undefined') ? d.maxUses : '';
      const expiry  = d ? (d.expiry || '') : '';
      const active  = d ? d.active !== false : true;
      return '<div class="disc-fields">' +
        '<div class="disc-field"><label>ส่วนลด (%)</label>' +
          '<input type="number" class="d-percent" min="1" max="100" step="1" value="' + escapeHtml(percent) + '" placeholder="10"></div>' +
        '<div class="disc-field"><label>จำกัดกี่ครั้ง</label>' +
          '<input type="number" class="d-maxuses" min="1" step="1" value="' + escapeHtml(maxUses) + '" placeholder="ว่าง = ไม่จำกัด"></div>' +
        '<div class="disc-field wide"><label>วันหมดอายุ (ว่าง = ไม่หมดอายุ)</label>' +
          '<input type="date" class="d-expiry" value="' + escapeHtml(expiry) + '"></div>' +
        '</div>' +
        '<label class="disc-toggle"><input type="checkbox" class="d-active"' + (active ? ' checked' : '') + '> เปิดใช้งานโค้ดนี้</label>';
    }

    function renderDiscountsTab(panel, discounts) {
      let html = '';

      // ---- การ์ดเพิ่มโค้ดใหม่ ----
      html += '<div class="section-title">เพิ่มโค้ดใหม่</div>';
      html += '<div class="disc-grid"><div class="disc-card is-new" id="discNewCard">' +
        '<div class="disc-card-head">' +
          '<input type="text" class="d-code" placeholder="เช่น SALE20" maxlength="30" ' +
          'style="font-family:var(--mono);font-size:15px;font-weight:700;text-transform:uppercase;padding:6px 9px;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;color:var(--copper-text);width:100%;">' +
        '</div>' +
        discountFieldsHtml(null) +
        '<div class="disc-card-foot">' +
          '<span class="row-status disc-msg"></span>' +
          '<button type="button" class="btn-sm accent disc-add-btn">+ เพิ่มโค้ด</button>' +
        '</div>' +
        '</div></div>';

      // ---- รายการโค้ดที่มีอยู่ ----
      html += '<div class="section-title">โค้ดทั้งหมด (' + discounts.length + ')</div>';
      if (discounts.length === 0) {
        html += '<div class="empty-state">ยังไม่มีโค้ดส่วนลดในชีต Discounts</div>';
        panel.innerHTML = html;
        wireDiscountNewCard(panel);
        return;
      }

      html += '<div class="disc-grid">';
      discounts.forEach(function (d) {
        const quota = (d.maxUses === null || typeof d.maxUses === 'undefined')
          ? 'ไม่จำกัด'
          : (d.usedCount + ' / ' + d.maxUses);
        html += '<div class="disc-card' + (d.active ? '' : ' is-off') + '" data-code="' + escapeHtml(d.code) + '">' +
          '<div class="disc-card-head">' +
            '<span class="disc-code">' + escapeHtml(d.code) + '</span>' +
            discountBadge(d) +
          '</div>' +
          '<div class="disc-usage">ใช้ไปแล้ว <strong>' + d.usedCount + '</strong> ครั้ง · โควตา ' + escapeHtml(quota) + '</div>' +
          discountFieldsHtml(d) +
          '<div class="disc-card-foot">' +
            '<span class="row-status disc-msg"></span>' +
            '<span style="display:flex;gap:7px;">' +
              '<button type="button" class="btn-sm danger disc-del-btn">ลบ</button>' +
              '<button type="button" class="btn-sm accent disc-save-btn">บันทึก</button>' +
            '</span>' +
          '</div>' +
          '</div>';
      });
      html += '</div>';

      panel.innerHTML = html;
      wireDiscountNewCard(panel);
      panel.querySelectorAll('.disc-card[data-code]').forEach(wireDiscountCard);
    }

    // อ่านค่าจากช่องกรอกในการ์ดหนึ่งใบ ให้อยู่ในรูปที่ backend รับได้
    function readDiscountCard(card) {
      const maxRaw = card.querySelector('.d-maxuses').value.trim();
      return {
        percent: Number(card.querySelector('.d-percent').value),
        maxUses: maxRaw === '' ? '' : Number(maxRaw),
        expiry: card.querySelector('.d-expiry').value.trim(),
        active: card.querySelector('.d-active').checked
      };
    }

    function setDiscMsg(card, text, kind) {
      const el = card.querySelector('.disc-msg');
      el.textContent = text;
      el.className = 'row-status disc-msg' + (kind ? ' ' + kind : '');
    }

    function wireDiscountNewCard(panel) {
      const card = panel.querySelector('#discNewCard');
      if (!card) return;
      const btn = card.querySelector('.disc-add-btn');
      const codeInput = card.querySelector('.d-code');

      codeInput.addEventListener('input', function () {
        codeInput.value = codeInput.value.toUpperCase();
      });

      btn.addEventListener('click', async function () {
        const code = codeInput.value.trim().toUpperCase();
        if (!code) { setDiscMsg(card, 'กรุณากรอกโค้ด', 'err'); return; }

        const payload = Object.assign({ code: code }, readDiscountCard(card));
        btn.disabled = true;
        setDiscMsg(card, 'กำลังบันทึก...');
        try {
          const result = await apiPost('saveDiscount', payload);
          if (result.result === 'success') {
            setDiscMsg(card, result.mode === 'updated' ? 'มีโค้ดนี้อยู่แล้ว — อัปเดตให้แทน ✓' : 'เพิ่มแล้ว ✓', 'ok');
            state.loaded.discounts = false;
            setTimeout(loadDiscountsTab, 600); // โหลดใหม่ให้เห็นโค้ดที่เพิ่งเพิ่ม
          } else {
            setDiscMsg(card, '⚠ ' + (result.message || 'บันทึกไม่สำเร็จ'), 'err');
          }
        } catch (err) {
          setDiscMsg(card, '⚠ เชื่อมต่อไม่สำเร็จ', 'err');
        }
        btn.disabled = false;
      });
    }

    function wireDiscountCard(card) {
      const code = card.dataset.code;
      const saveBtn = card.querySelector('.disc-save-btn');
      const delBtn = card.querySelector('.disc-del-btn');

      saveBtn.addEventListener('click', async function () {
        const payload = Object.assign({ code: code }, readDiscountCard(card));
        saveBtn.disabled = true;
        setDiscMsg(card, 'กำลังบันทึก...');
        try {
          const result = await apiPost('saveDiscount', payload);
          if (result.result === 'success') {
            setDiscMsg(card, 'บันทึกแล้ว ✓', 'ok');
            state.loaded.discounts = false;
            setTimeout(loadDiscountsTab, 600);
          } else {
            setDiscMsg(card, '⚠ ' + (result.message || 'บันทึกไม่สำเร็จ'), 'err');
          }
        } catch (err) {
          setDiscMsg(card, '⚠ เชื่อมต่อไม่สำเร็จ', 'err');
        }
        saveBtn.disabled = false;
      });

      delBtn.addEventListener('click', async function () {
        if (!confirm('ลบโค้ด "' + code + '" ออกจากชีต Discounts?\n\nลบแล้วกู้จากหน้านี้ไม่ได้ (กู้ได้จาก File > Version history ของ Google Sheets เท่านั้น)')) return;

        delBtn.disabled = true;
        setDiscMsg(card, 'กำลังลบ...');
        try {
          const result = await apiPost('deleteDiscount', { code: code });
          if (result.result === 'success') {
            setDiscMsg(card, 'ลบแล้ว ✓', 'ok');
            card.style.opacity = '.4';
            state.loaded.discounts = false;
            setTimeout(loadDiscountsTab, 600);
          } else {
            setDiscMsg(card, '⚠ ' + (result.message || 'ลบไม่สำเร็จ'), 'err');
            delBtn.disabled = false;
          }
        } catch (err) {
          setDiscMsg(card, '⚠ เชื่อมต่อไม่สำเร็จ', 'err');
          delBtn.disabled = false;
        }
      });
    }

    // ========== Auth / session ==========
    function onAuthFail(message) {
      setStatus('');
      sessionStorage.removeItem(PASSWORD_SESSION_KEY);
      showLogin(message || 'รหัสผ่านไม่ถูกต้อง หรือเซสชันหมดอายุ');
    }

    function showDashboard(password, preloadedDashboard) {
      state.password = password;
      state.loaded = {};
      if (preloadedDashboard) {
        renderProfitTab(document.getElementById('panel-profit'), preloadedDashboard);
        state.loaded.profit = true;
        setStatus('อัปเดตล่าสุด: ' + new Date().toLocaleString('th-TH') + (preloadedDashboard.timezone ? ' (เขตเวลา ' + preloadedDashboard.timezone + ')' : ''));
      }
      loginScreen.classList.add('hidden');
      dashboardScreen.classList.remove('hidden');
      switchTab(state.activeTab || 'profit');
    }

    function showLogin(errorMsg) {
      dashboardScreen.classList.add('hidden');
      loginScreen.classList.remove('hidden');
      loginError.textContent = errorMsg || '';
      passwordInput.value = '';
      passwordInput.focus();
    }

    loginBtn.addEventListener('click', async function () {
      const pw = passwordInput.value.trim();
      if (!pw) { loginError.textContent = 'กรุณากรอกรหัสผ่าน'; return; }
      loginError.textContent = '';
      loginBtn.disabled = true;
      loginBtn.textContent = 'กำลังตรวจสอบ…';

      try {
        const params = new URLSearchParams({ action: 'getDashboard', password: pw });
        const res = await fetch(ORDER_WEBHOOK_URL + '?' + params.toString());
        const result = await res.json();

        if (result.result !== 'success') {
          loginError.textContent = result.message || 'รหัสผ่านไม่ถูกต้อง';
          return;
        }

        sessionStorage.setItem(PASSWORD_SESSION_KEY, pw);
        showDashboard(pw, result.dashboard);
      } catch (err) {
        loginError.textContent = 'เชื่อมต่อระบบไม่สำเร็จ กรุณาลองใหม่';
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'เข้าสู่ระบบ';
      }
    });

    passwordInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') loginBtn.click(); });

    refreshBtn.addEventListener('click', function () {
      state.loaded[state.activeTab] = false;
      loadTab(state.activeTab);
    });

    logoutBtn.addEventListener('click', function () {
      sessionStorage.removeItem(PASSWORD_SESSION_KEY);
      showLogin('');
    });

    const savedPassword = sessionStorage.getItem(PASSWORD_SESSION_KEY);
    if (savedPassword) {
      showDashboard(savedPassword);
    } else {
      showLogin('');
    }
  </script>
</body>

</html>
